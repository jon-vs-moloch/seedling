<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seedling</title>
    <style>
        /* Splash shown by the desktop shell while the supervisor starts.
           Same palette as the supervisor dashboard; no external requests. */
        :root { color-scheme: light; --bg: #f6f6f3; --text: #1b1e19; --muted: #5d6358; --accent: #2f7d4f; --accent-ink: #fff; --ring: rgba(47, 125, 79, .25); }
        @media (prefers-color-scheme: dark) {
            :root { color-scheme: dark; --bg: #0e110e; --text: #e6ebe3; --muted: #a1a99c; --accent: #5cc48a; --accent-ink: #0b130e; --ring: rgba(92, 196, 138, .25); }
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg); color: var(--text);
            font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
            user-select: none;
        }
        .mark { position: relative; width: 72px; height: 72px; }
        .mark svg { position: relative; width: 72px; height: 72px; }
        .mark::before {
            content: ""; position: absolute; inset: -10px; border-radius: 26px; border: 2px solid var(--ring);
            animation: breathe 2.4s ease-in-out infinite;
        }
        @keyframes breathe { 0%, 100% { transform: scale(.94); opacity: .4; } 50% { transform: scale(1.04); opacity: 1; } }
        @media (prefers-reduced-motion: reduce) { .mark::before { animation: none; } }
        h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
        .status { font-size: 13px; color: var(--muted); min-height: 1.3em; }
    </style>
</head>
<body>
    <div class="mark">
        <svg viewBox="0 0 32 32" aria-hidden="true">
            <rect width="32" height="32" rx="8" fill="var(--accent)"/>
            <path d="M16 26V15" stroke="var(--accent-ink)" stroke-width="2" stroke-linecap="round"/>
            <path d="M16 16c0-4.5-3-7-8-7 0 4.5 3 7 8 7z" fill="var(--accent-ink)"/>
            <path d="M16 14c0-4 2.6-6.5 7-6.5 0 4-2.6 6.5-7 6.5z" fill="var(--accent-ink)" opacity=".75"/>
        </svg>
    </div>
    <h1>Seedling</h1>
    <div class="status" id="status">Starting supervisor…</div>
    <script>
        const status = document.getElementById('status');
        const PORT = 7000;
        let dots = 0;
        async function poll() {
            dots = (dots + 1) % 4;
            status.textContent = 'Starting supervisor' + '.'.repeat(dots);
            try {
                const r = await fetch(`http://127.0.0.1:${PORT}/`, { signal: AbortSignal.timeout(800) });
                if (r.ok) {
                    status.textContent = 'Ready';
                    setTimeout(() => { window.location.href = `http://127.0.0.1:${PORT}/`; }, 150);
                    return;
                }
            } catch {}
            setTimeout(poll, 600);
        }
        poll();
    </script>
</body>
</html>
