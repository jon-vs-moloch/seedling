<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seedling Operator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="top">
        <div class="brand">
            <svg viewBox="0 0 32 32" aria-hidden="true">
                <rect width="32" height="32" rx="8" fill="var(--accent)"/>
                <circle cx="16" cy="16" r="6.5" fill="none" stroke="var(--accent-ink)" stroke-width="2"/>
                <circle cx="16" cy="16" r="2.5" fill="var(--accent-ink)"/>
            </svg>
            <div>
                <h1>Operator</h1>
                <p id="roleBadge">—</p>
            </div>
        </div>
        <span class="chip" id="statusBadge"><span class="dot"></span>Paused</span>
    </header>

    <main class="main">
        <section class="card vision">
            <div class="card-head"><h2>What the operator sees</h2><span class="spacer"></span><span class="faint mono" id="targetUrl"></span></div>
            <div class="image-wrapper">
                <img id="liveView" src="/api/image" alt="Latest screenshot of the ZenCode UI" hidden />
                <div class="placeholder" id="noShot">No screenshot yet</div>
            </div>
        </section>

        <aside class="side">
            <section class="card">
                <div class="card-head"><h2>Goal</h2></div>
                <div class="body">
                    <label class="label" for="goalInput">The operator works toward this, one click or keystroke at a time.</label>
                    <textarea id="goalInput" rows="4">Use ZenCode to improve ZenCode</textarea>
                    <button id="toggleBtn" class="btn primary play" type="button">Start Operator Loop</button>
                </div>
            </section>
            <section class="card">
                <div class="card-head"><h2>Last action</h2></div>
                <div id="telemetryOut" class="telemetry">Operator standing by…</div>
            </section>
            <section class="card">
                <div class="card-head"><h2>Action space</h2></div>
                <ul class="actions">
                    <li><code>click</code> a selector</li>
                    <li><code>fill</code> a field and press Enter</li>
                    <li><code>wait</code> some milliseconds</li>
                    <li><code>done</code> when the goal is met</li>
                </ul>
            </section>
        </aside>
    </main>
    <script src="app.js"></script>
</body>
</html>
